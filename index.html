<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>First Verified - Sakiwin</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            font-family: 'Poppins', sans-serif;
            /* Apnar logo-er sathe matching deep navy blue & dark purple gradient */
            background-color: #030014;
            background-image: 
                radial-gradient(circle at 50% 25%, rgba(67, 56, 202, 0.4) 0%, rgba(15, 5, 30, 0.8) 50%, #030014 100%),
                radial-gradient(circle at 20% 80%, rgba(126, 34, 206, 0.25) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(59, 130, 246, 0.2) 0%, transparent 50%);
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
        }

        .verify-card {
            background: rgba(15, 12, 30, 0.85);
            border: 1px solid rgba(139, 92, 246, 0.3);
            width: 90%;
            max-width: 420px;
            padding: 36px 24px;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 25px rgba(99, 102, 241, 0.2);
            backdrop-filter: blur(12px);
        }

        .verify-title {
            font-size: 28px;
            font-weight: 700;
            color: #00ff66;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-shadow: 0 0 15px rgba(0, 255, 102, 0.4);
        }

        .verify-desc {
            font-size: 13px;
            color: #94a3b8;
            line-height: 1.6;
            margin-bottom: 30px;
            padding: 0 10px;
        }

        .btn-signup {
            display: block;
            width: 100%;
            background: linear-gradient(135deg, #ff9900, #ff6600);
            color: #000 !important;
            font-weight: 700;
            font-size: 16px;
            padding: 15px;
            border-radius: 12px;
            text-decoration: none;
            margin-bottom: 14px;
            box-shadow: 0 4px 15px rgba(255, 153, 0, 0.3);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            letter-spacing: 0.5px;
        }

        .btn-signup:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 153, 0, 0.4);
        }

        .btn-download {
            display: block;
            width: 100%;
            background: transparent;
            border: 1.5px solid #00ff66;
            color: #00ff66 !important;
            font-weight: 600;
            font-size: 15px;
            padding: 14px;
            border-radius: 12px;
            text-decoration: none;
            margin-bottom: 24px;
            transition: all 0.2s ease;
        }

        .btn-download:hover {
            background: rgba(0, 255, 102, 0.1);
        }

        .policy-link {
            font-size: 11px;
            color: #64748b;
            text-decoration: underline;
            transition: color 0.2s;
        }

        .policy-link:hover {
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <div class="verify-card">
        <h1 class="verify-title">First Verified <i class="fa-solid fa-circle-check"></i></h1>
        
        <p class="verify-desc">
            Your identity has been securely verified. Click the button below to proceed to the registration page.
        </p>

        <!-- Sign Up Button -->
        <a href="https://sakiwin.com/r_LCyp1HTa" target="_blank" class="btn-signup">
            SIGN UP NOW
        </a>

        <!-- Download App Button -->
        <a href="https://sakiwin.com/r_LCyp1HTa" target="_blank" class="btn-download">
            Download App
        </a>

        <!-- Privacy Policy Link -->
        <a href="https://sakiwin.com/r_LCyp1HTa" target="_blank" class="policy-link">
            Privacy & Terms Policy
        </a>
    </div>

</body>
</html>
